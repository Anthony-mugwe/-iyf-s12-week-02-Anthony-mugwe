<nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html">Projects</a><a class="current" aria-current="page" href="contact.html">Contact</a></nav></div></header>
<main class="container page-content">
  <p class="eyebrow">GET IN TOUCH</p><h1>Contact me</h1>
  <p>Use the form layout below as a practice example. It does not send messages to a server yet.</p>
  <form class="contact-form" action="#" method="get" onsubmit="return false;">
    <label for="name">Your name</label><input id="name" name="name" type="text" autocomplete="name" required>
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="subject">Subject</label><input id="subject" name="subject" type="text" required>
    <label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea>
    <button class="button" type="submit">Send message (demo)</button>
  </form>
  <p class="contact-note">Email: <a href="mailto:replace-with-your-email@example.com">replace-with-your-email@example.com</a></p>
</main>
